<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Football Career</title>
    <meta name="description" content="Football Career — play a footballer from youngster to retirement. An HTML5 game built on a port of Gameplay Football." />
    <meta name="theme-color" content="#0b1410" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Football Career" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
    <link rel="apple-touch-icon" href="./icons/icon-maskable.svg" />
    <link rel="preload" href="./data/media/fonts/alegreya/AlegreyaSansSC-ExtraBold.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="./data/media/fonts/alegreya/AlegreyaSans-ExtraBold.ttf" as="font" type="font/ttf" crossorigin />

    <style>
      /* Alegreya Sans / Alegreya Sans SC by Juan Pablo del Peral (SIL OFL, media/fonts/alegreya/OFL.txt) */
      @font-face {
        font-family: 'Alegreya Sans';
        src: url('./data/media/fonts/alegreya/AlegreyaSans-ExtraBold.ttf') format('truetype');
        font-weight: 800;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Alegreya Sans SC';
        src: url('./data/media/fonts/alegreya/AlegreyaSansSC-Bold.ttf') format('truetype');
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Alegreya Sans SC';
        src: url('./data/media/fonts/alegreya/AlegreyaSansSC-ExtraBold.ttf') format('truetype');
        font-weight: 800;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Alegreya Sans SC';
        src: url('./data/media/fonts/alegreya/AlegreyaSansSC-Black.ttf') format('truetype');
        font-weight: 900;
        font-style: normal;
        font-display: swap;
      }

      /* layers (see src/ui/router.ts): canvas behind, HUD above it, menus on top */
      html, body { margin: 0; height: 100%; background: #0b1410; overflow: hidden; }
      #game-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; touch-action: none; }
      #hud { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
      #app { position: fixed; inset: 0; z-index: 2; }

      /* boot splash (removed by src/main.ts once the title screen is up) */
      #boot-splash {
        position: fixed; inset: 0; z-index: 50; display: grid; place-items: center;
        background: radial-gradient(120% 90% at 50% 110%, #173d28 0%, #0b1410 60%);
        color: #eef4ef; font-family: 'Alegreya Sans SC', 'Segoe UI', system-ui, sans-serif;
        transition: opacity 0.5s ease, visibility 0.5s;
      }
      #boot-splash.is-done { opacity: 0; visibility: hidden; }
      .boot-inner { display: grid; justify-items: center; gap: 18px; padding: 16px; text-align: center; }
      .boot-mark { line-height: 0.9; text-transform: uppercase; }
      .boot-mark span { display: block; }
      .boot-mark .top { font-size: 18px; letter-spacing: 0.5em; color: #3ddc84; font-weight: 800; padding-left: 0.5em; }
      .boot-mark .main { font-size: clamp(44px, 12vw, 76px); font-weight: 900; letter-spacing: 0.04em; }
      .boot-ball {
        width: 40px; height: 40px; border-radius: 50%;
        border: 3px solid rgba(255, 255, 255, 0.18); border-top-color: #3ddc84;
        animation: boot-spin 0.9s linear infinite;
      }
      .boot-track { width: min(280px, 70vw); height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.1); overflow: hidden; }
      #boot-bar { height: 100%; background: #3ddc84; transform: scaleX(0); transform-origin: left; transition: transform 0.3s ease; }
      #boot-status { font-size: 14px; letter-spacing: 0.12em; text-transform: uppercase; color: #9fb3a7; min-height: 1.2em; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .boot-ball { animation-duration: 3s; } }
    </style>
    <link rel="stylesheet" href="/src/ui/theme.css" />
    <link rel="stylesheet" href="/src/ui/menus.css" />
    <link rel="stylesheet" href="/src/ui/ingame.css" />
    <link rel="stylesheet" href="/src/ui/hud.css" />
  </head>
  <body>
    <canvas id="game-canvas" aria-hidden="true"></canvas>
    <div id="hud"></div>
    <div id="app"></div>

    <div id="boot-splash" role="status" aria-live="polite">
      <div class="boot-inner">
        <div class="boot-mark" aria-label="Football Career"><span class="top">Football</span><span class="main">Career</span></div>
        <div class="boot-ball" aria-hidden="true"></div>
        <div class="boot-track" aria-hidden="true"><div id="boot-bar"></div></div>
        <div id="boot-status">Loading</div>
      </div>
      <noscript style="position: fixed; bottom: 24px; left: 16px; right: 16px; text-align: center; color: #ffb14e">Football Career needs JavaScript to run.</noscript>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
